<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Jugadores | EFUSA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100">

<script>
if (localStorage.getItem("auth") !== "true") {
  location.href = "login.html";
}
</script>

<!-- Barra de navegación -->
<nav class="bg-green-700 text-white p-4 shadow-lg">
  <div class="container mx-auto flex justify-between items-center">
    <h1 class="text-xl font-bold flex items-center">
      <i class="fas fa-futbol mr-2"></i> EFUSA - Gestión de Jugadores
    </h1>
    <div class="flex items-center space-x-4">
      <button onclick="history.back()" class="bg-gray-600 hover:bg-gray-700 px-3 py-1 rounded text-sm">
        <i class="fas fa-arrow-left mr-1"></i> Volver
      </button>
      <span class="text-sm">Admin</span>
      <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-3 py-1 rounded text-sm">
        <i class="fas fa-sign-out-alt mr-1"></i> Cerrar sesión
      </button>
    </div>
  </div>
</nav>

<!-- Menú de navegación -->
<div class="bg-green-600 text-white p-2">
  <div class="container mx-auto flex space-x-2">
    <a href="index.html" class="px-3 py-2 rounded hover:bg-green-700 transition">
      <i class="fas fa-home mr-1"></i> Dashboard
    </a>
    <a href="jugadores.html" class="px-3 py-2 rounded bg-green-700 hover:bg-green-800 transition">
      <i class="fas fa-users mr-1"></i> Jugadores
    </a>
    <a href="pagos.html" class="px-3 py-2 rounded hover:bg-green-700 transition">
      <i class="fas fa-money-bill-wave mr-1"></i> Pagos
    </a>
    <a href="alertas.html" class="px-3 py-2 rounded hover:bg-green-700 transition">
      <i class="fas fa-exclamation-triangle mr-1"></i> Alertas
    </a>
    <a href="historial.html" class="px-3 py-2 rounded hover:bg-green-700 transition">
      <i class="fas fa-history mr-1"></i> Historial
    </a>
    <a href="reportes.html" class="px-3 py-2 rounded hover:bg-green-700 transition">
      <i class="fas fa-file-alt mr-1"></i> Reportes
    </a>
  </div>
</div>

<main class="container mx-auto p-6">

<div class="bg-white p-6 rounded shadow-lg mb-6">
  <h2 class="text-xl font-bold mb-4 flex items-center">
    <i class="fas fa-user-plus mr-2 text-blue-600"></i>
    Nuevo Jugador
  </h2>
  
  <form id="formJugador" class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Nombre</label>
      <input id="nombre" placeholder="Nombre" class="border p-2 w-full rounded" required>
    </div>
    
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Apellido</label>
      <input id="apellido" placeholder="Apellido" class="border p-2 w-full rounded" required>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Fecha de Nacimiento</label>
      <input type="date" id="fecha_nacimiento" class="border p-2 w-full rounded" required>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Categoría</label>
      <select id="categoria" class="border p-2 w-full rounded" required>
        <option value="">Seleccionar categoría</option>
        <option>Sub 18-17</option>
        <option>Sub 16-15</option>
        <option>Sub 14-13</option>
        <option>Sub 12-11</option>
        <option>Sub 10-9</option>
        <option>Sub 8-7</option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Identificación</label>
      <input id="identificacion" placeholder="Identificación" class="border p-2 w-full rounded">
    </div>
    
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Sangre</label>
      <input id="tipo_sangre" placeholder="Tipo de sangre" class="border p-2 w-full rounded">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Acudiente</label>
      <input id="acudiente" placeholder="Acudiente" class="border p-2 w-full rounded">
    </div>
    
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono Acudiente</label>
      <input id="telefono_acudiente" placeholder="Teléfono acudiente" class="border p-2 w-full rounded">
    </div>

    <div class="col-span-1 md:col-span-2">
      <button type="submit" class="bg-green-600 hover:bg-green-700 text-white p-2 rounded w-full transition">
        <i class="fas fa-save mr-2"></i> Guardar Jugador
      </button>
    </div>
  </form>
</div>

<div class="bg-white p-6 rounded shadow-lg">
  <h2 class="text-xl font-bold mb-4 flex items-center">
    <i class="fas fa-list mr-2 text-blue-600"></i>
    Lista de Jugadores
  </h2>
  
  <div class="overflow-x-auto">
    <table class="w-full text-sm">
      <thead>
        <tr class="border-b bg-gray-50">
          <th class="text-left p-2">Nombre</th>
          <th class="text-left p-2">Apellido</th>
          <th class="text-left p-2">Categoría</th>
          <th class="text-left p-2">Estado</th>
          <th class="text-left p-2">Acciones</th>
        </tr>
      </thead>
      <tbody id="tablaJugadores"></tbody>
    </table>
  </div>
  
  <!-- Paginación -->
  <div id="paginacion" class="mt-4"></div>
</div>

</main>

<!-- Scripts -->
<script src="js/api.js"></script>
<script src="js/utils.js"></script>
<script src="js/jugadores.js"></script>
</body>
</html>
