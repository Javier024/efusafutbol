<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Historial | EFUSA</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">

<header class="bg-green-700 text-white p-4 mb-4 rounded">
  <h1 class="text-xl font-bold">📜 Historial de Pagos</h1>
</header>

<div class="bg-white p-4 rounded shadow max-w-2xl mx-auto">
  <label class="block mb-2 font-bold">Seleccionar Jugador:</label>
  <select id="jugador" class="border p-2 mb-4 w-full rounded"></select>
  
  <h3 class="font-bold mb-2">Pagos realizados:</h3>
  <ul id="listaPagos" class="list-disc pl-5"></ul>
</div>

<script>
// URL CONFIGURADA
const API_URL = "https://script.google.com/macros/s/AKfycbxi8pnqdpjBiMzfwv3kLFGritmgC9tg5oVMxKFugunQYtAwBZVnXnkPvEycOZYMEpAgnA/exec";

// Referencias al DOM
const selectJugador = document.getElementById("jugador");
const listaPagos = document.getElementById("listaPagos");

Promise.all([
  fetch(`${API_URL}?action=getJugadores`).then(r => r.json()),
  fetch(`${API_URL}?action=getPagos`).then(r => r.json())
]).then(([jugadores, pagos]) => {

  jugadores.forEach(j => {
    const option = document.createElement("option");
    option.value = j.id;
    option.innerText = `${j.nombre} ${j.apellido}`;
    selectJugador.appendChild(option);
  });

  selectJugador.addEventListener("change", () => {
    listaPagos.innerHTML = "";
    const pagosFiltrados = pagos.filter(p => p.id_jugador == selectJugador.value);
    
    if(pagosFiltrados.length === 0) {
        listaPagos.innerHTML = "<li class='text-gray-500'>No hay pagos registrados.</li>";
        return;
    }

    pagosFiltrados.forEach(p => {
      const li = document.createElement("li");
      li.className = "mb-2 p-2 border-b";
      li.innerHTML = `<span class="font-bold">${p.mes_inicio} a ${p.mes_fin}</span> - $${p.total_pagado} (${p.tipo_pago})`;
      listaPagos.appendChild(li);
    });
  });
}).catch(err => console.error(err));
</script>

</body>
</html>
