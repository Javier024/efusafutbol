<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login | EFUSA</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

<form id="loginForm" class="bg-white p-6 rounded shadow w-80">
  <h2 class="text-xl font-bold mb-4 text-center">🔐 Login Admin</h2>

  <input id="usuario" class="border p-2 w-full mb-3" placeholder="Usuario" required>
  <input id="clave" type="password" class="border p-2 w-full mb-4" placeholder="Contraseña" required>

  <button class="bg-green-600 text-white w-full p-2 rounded hover:bg-green-700">
    Ingresar
  </button>
</form>

<script>
document.getElementById("loginForm").addEventListener("submit", e => {
  e.preventDefault();

  if (usuario.value === "admin" && clave.value === "1234") {
    localStorage.setItem("auth", "true");
    location.href = "index.html";
  } else {
    alert("Credenciales incorrectas");
  }
});
</script>
</body>
</html>
